name: Deploy Osaka trip page

on:
  push:
    branches:
      - cursor/osaka-kyoto-trip-page-547d
    paths:
      - public/trips/osaka-kyoto-2025/**
      - .github/workflows/pages-osaka.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/trip
          cp public/trips/osaka-kyoto-2025/osaka-kyoto-2026.html _site/trip/index.html
          # Root redirect to the trip page so the base URL also works.
          cat > _site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <title>大阪京都瘋女18</title>
          <script>location.replace('./trip/' + location.hash)</script>
          <a href="./trip/">前往行程手冊</a>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
